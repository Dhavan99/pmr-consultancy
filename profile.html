<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - PMR&Co Consultancy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body style="background-color: var(--clr-bg);">
    <!-- Minimal Navbar -->
    <nav class="navbar" style="border-bottom: 1px solid var(--clr-border);">
        <div class="nav-container container">
            <a href="index.html" class="logo">PMR&Co<span>.</span></a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
                <div style="display: flex; align-items: center; gap: 0.5rem; margin-right: 0.5rem;">
                    <button id="logout-btn" class="btn btn-secondary" style="padding: 0.3rem 0.8rem; font-size: 0.8rem;">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="profile-main container">
        
        <!-- Profile Header -->
        <section class="profile-header">
            <div class="profile-avatar" id="avatar-initial">?</div>
            <div class="profile-info">
                <h1 id="profile-name">Loading...</h1>
                <p id="profile-email">Fetching account details...</p>
                <p style="font-size: 0.85rem; margin-top: 0.5rem;">Member since: <span id="profile-date">-</span></p>
            </div>
        </section>

        <!-- Purchase History -->
        <section class="history-section">
            <h2>My Library & Purchase History</h2>
            
            <div id="orders-container">
                <div style="text-align: center; padding: var(--space-8); color: var(--clr-text-secondary);">
                    Loading your purchased projects...
                </div>
            </div>
        </section>

    </main>

    <!-- Simple Footer -->
    <footer style="padding: var(--space-8) 0; text-align: center; border-top: 1px solid var(--clr-border); margin-top: var(--space-16);">
        <p style="color: var(--clr-text-secondary); font-size: 0.85rem;">&copy; 2026 PMR&Co Consultancy. All rights reserved.</p>
    </footer>

    <script>
        // Authentication Guard
        const token = localStorage.getItem('pmr_token');
        if (!token) {
            window.location.href = 'login.html';
        }

        // Logout logic
        document.getElementById('logout-btn').addEventListener('click', () => {
            localStorage.removeItem('pmr_token');
            localStorage.removeItem('pmr_user');
            localStorage.removeItem('pmr_user_email');
            window.location.href = 'index.html';
        });

        // Fetch Profile Data
        async function fetchProfile() {
            try {
                const response = await fetch('/api/profile', {
                    method: 'GET',
                    headers: {
                        'Authorization': 'Bearer ' + token
                    }
                });

                if (response.status === 401 || response.status === 403) {
                    // Token expired or invalid
                    localStorage.removeItem('pmr_token');
                    window.location.href = 'login.html';
                    return;
                }

                if (!response.ok) {
                    throw new Error('Failed to fetch profile');
                }

                const data = await response.json();
                renderProfile(data);

            } catch (error) {
                document.getElementById('orders-container').innerHTML = `
                    <div style="text-align: center; padding: var(--space-8); color: #b91c1c;">
                        Error loading profile data. Is the backend running?
                    </div>
                `;
            }
        }

        function renderProfile(data) {
            const user = data.user;
            const orders = data.orders;

            // Render Info
            document.getElementById('profile-name').textContent = user.name;
            document.getElementById('profile-email').textContent = user.email;
            document.getElementById('avatar-initial').textContent = user.name.charAt(0).toUpperCase();
            
            // Format Date safely
            if(user.created_at) {
                const date = new Date(user.created_at.replace(' ', 'T') + 'Z');
                document.getElementById('profile-date').textContent = date.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
            }

            // Render Orders
            const ordersContainer = document.getElementById('orders-container');
            
            if (orders.length === 0) {
                ordersContainer.innerHTML = `
                    <div style="text-align: center; padding: var(--space-8); border: 1px dashed var(--clr-border); border-radius: var(--radius-lg);">
                        <p style="color: var(--clr-text-secondary); margin-bottom: var(--space-4);">You haven't purchased any projects yet.</p>
                        <a href="index.html" class="btn btn-primary">Browse Projects</a>
                    </div>
                `;
                return;
            }

            ordersContainer.innerHTML = ''; // Clear loading text

            orders.forEach(order => {
                const orderDate = new Date(order.created_at.replace(' ', 'T') + 'Z').toLocaleDateString();
                
                const card = document.createElement('div');
                card.className = 'order-card';
                
                let itemsHtml = '';
                order.items.forEach(item => {
                    itemsHtml += `
                        <div class="purchased-item">
                            <div>
                                <div class="item-title">${item.project_title}</div>
                                <div class="item-id">Project ID: ${item.project_id}</div>
                            </div>
                            <button class="btn btn-secondary" onclick="alert('Downloading files for: ${item.project_title}...')" style="padding: 0.4rem 1rem; font-size: 0.85rem; display: flex; align-items: center; gap: 0.5rem;">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                    <polyline points="7 10 12 15 17 10"></polyline>
                                    <line x1="12" y1="15" x2="12" y2="3"></line>
                                </svg>
                                Download
                            </button>
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div class="order-header">
                        <div class="order-meta">
                            <div class="meta-item">
                                <span class="meta-label">Order Placed</span>
                                <span class="meta-value">${orderDate}</span>
                            </div>
                            <div class="meta-item">
                                <span class="meta-label">Total Amount</span>
                                <span class="meta-value">$${order.total_amount.toFixed(2)}</span>
                            </div>
                        </div>
                        <div class="meta-item" style="align-items: flex-end;">
                            <span class="meta-label">Order #</span>
                            <span class="meta-value" style="font-family: monospace;">${order.id.toString().padStart(5, '0')}</span>
                        </div>
                    </div>
                    <div class="order-body">
                        ${itemsHtml}
                    </div>
                `;
                ordersContainer.appendChild(card);
            });
        }

        // Initialize
        fetchProfile();
    </script>
</body>
</html>
