<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reset your password for PMR&Co Consultancy.">
    <title>Forgot Password | PMR&Co Consultancy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
    <!-- Minimal Navbar -->
    <header class="navbar" style="position: static; border-bottom: 1px solid var(--clr-border);">
        <div class="container nav-container" style="justify-content: center;">
            <a href="index.html" class="logo">PMR&Co<span>.</span></a>
        </div>
    </header>

    <main class="auth-main">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Reset Password</h1>
                <p>Enter your email and we'll send you a link to reset your password.</p>
            </div>

            <form onsubmit="event.preventDefault(); alert('Password reset link has been sent to your email.'); window.location.href='login.html';">
                <div class="form-group" style="margin-bottom: var(--space-8);">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="name@example.com">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Send Reset Link</button>
            </form>

            <div class="auth-footer">
                <a href="login.html" style="display: inline-flex; align-items: center; gap: 0.5rem; color: var(--clr-text-secondary); text-decoration: none;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    Back to login
                </a>
            </div>
        </div>
    </main>
</body>
</html>
